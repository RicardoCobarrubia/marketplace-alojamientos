# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Revisión automática de los pull requests (MA-92).
language: es-ES

reviews:
  profile: chill
  request_changes_workflow: false
  # El resumen va en el comentario de revisión, no en la descripción del PR.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    # Las historias se encadenan (un PR apunta a la rama de la historia anterior),
    # así que se revisan PR hacia cualquier rama, no solo hacia main.
    base_branches:
      - ".*"
  path_instructions:
    - path: "backend/src/main/java/**/*.java"
      instructions: >-
        Backend Spring Boot 4 con Java 21. Revisar: reglas de negocio en los servicios y no en
        los controladores; un solo DTO por entidad, con los campos que pone el sistema en solo
        lectura; validación de propiedad (un anfitrión solo modifica lo suyo); transacciones;
        manejo de errores con ExcepcionMarketplace y Problem Details; que no se registren datos
        sensibles en los logs (contraseñas, tokens, datos de pago).
    - path: "backend/src/main/resources/db/migration/*.sql"
      instructions: >-
        Migraciones Flyway para PostgreSQL 17. Una migración ya publicada no se modifica: los
        cambios van en una nueva versión. Revisar restricciones (CHECK, UNIQUE, EXCLUDE) e
        índices de las consultas frecuentes.
    - path: "backend/src/test/java/**/*.java"
      instructions: >-
        Pruebas con JUnit 5, Mockito y Testcontainers. Revisar que cubran los escenarios de
        aceptación de la historia de Jira, incluidos los casos de error.

chat:
  auto_reply: true
