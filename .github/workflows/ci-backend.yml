# MA-91: integración continua del backend.
# Se ejecuta en cada Pull Request y en cada push a main: compila, corre las pruebas
# (unitarias y de integración con Testcontainers) y genera el reporte de cobertura JaCoCo.

name: CI backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Si llega un push nuevo al mismo PR, cancela la ejecución anterior
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-y-probar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo necesita para el análisis (MA-92)
          fetch-depth: 0

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, probar y medir cobertura
        # Las pruebas de integración usan Testcontainers; ubuntu-latest ya trae Docker
        run: ./mvnw -B -ntp verify

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Guardar reportes de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
