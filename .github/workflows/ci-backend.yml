# MA-91 y MA-92: integración continua del backend.
# Se ejecuta en cada Pull Request y en cada push a main: compila, corre las pruebas
# (unitarias y de integración con Testcontainers), genera el reporte de cobertura JaCoCo
# y envía el análisis a SonarCloud, que publica el Quality Gate en el PR.

name: CI backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Si llega un push nuevo al mismo PR, cancela la ejecución anterior
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-y-probar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      SONAR_PLUGIN: org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo necesita para el análisis (MA-92)
          fetch-depth: 0

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, probar y medir cobertura
        # Las pruebas de integración usan Testcontainers; ubuntu-latest ya trae Docker
        run: ./mvnw -B -ntp verify

      # El token de SonarCloud (Settings → Secrets and variables → Actions) solo se entrega
      # a los dos pasos que lo usan; las pruebas y la compilación no lo ven.
      - name: Verificar el token de SonarCloud
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "disponible=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Análisis de SonarCloud
        # Si el secreto no existe (por ejemplo, en un PR desde un fork) se salta este paso
        if: steps.sonar.outputs.disponible == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp $SONAR_PLUGIN:sonar

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Guardar reportes de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
