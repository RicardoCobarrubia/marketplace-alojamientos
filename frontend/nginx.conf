# Sirve la aplicación React. Las rutas del navegador (/reservas, /admin...) devuelven index.html
# para que las resuelva React Router. /api normalmente la envía Traefik al backend.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Solo llega aquí si no hay ninguna réplica del backend: se responde 503 con el formato de
    # error de la API (Problem Details), no la página de React con un 200
    location ^~ /api {
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"El servicio no está disponible en este momento. Intenta de nuevo en unos minutos.","codigo":"SERVICIO_NO_DISPONIBLE"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con huella en el nombre no cambian: el navegador los guarda un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html siempre fresco, para que tome la última versión
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
