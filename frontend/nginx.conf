# Sirve la aplicación React. Las rutas del navegador (/reservas, /admin...) devuelven index.html
# para que las resuelva React Router; /api nunca llega aquí, Traefik la envía al backend.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con huella en el nombre no cambian: el navegador los guarda un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html siempre fresco, para que tome la última versión
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
