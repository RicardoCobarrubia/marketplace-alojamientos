# Servicios para desarrollo local.
# Uso, desde la carpeta backend:  docker compose up -d
# Toma DB_USERNAME y DB_PASSWORD del archivo .env

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data

  # Servidor SMTP de prueba: captura los correos sin enviarlos.
  # Bandeja web en http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  datos-postgres:
