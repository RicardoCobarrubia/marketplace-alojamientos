# ─────────────────────────────────────────────────────────
# PRODUCCIÓN
# Se activa con SPRING_PROFILES_ACTIVE=prod.
# Todos los valores llegan por variables de entorno (GitHub Secrets
# en el pipeline). NUNCA escribir valores reales aquí.
# ─────────────────────────────────────────────────────────

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Detrás de Traefik: respeta las cabeceras X-Forwarded-*
server.forward-headers-strategy=framework

# Logs JSON con el id de correlación, para Grafana Alloy y Loki (ADR-012)
logging.structured.format.console=ecs
logging.level.root=INFO

# Swagger apagado en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
