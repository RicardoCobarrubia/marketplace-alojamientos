# ─────────────────────────────────────────────────────────
# Configuración BASE, común a todos los ambientes.
# Lo que cambia por ambiente va en application-dev.properties
# y application-prod.properties.
# Ningún secreto va en estos archivos: llegan por variables de entorno.
# ─────────────────────────────────────────────────────────

spring.application.name=marketplace

# Perfil por defecto. En producción se cambia con SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# En desarrollo lee las variables del archivo backend/.env (no se sube al repositorio)
spring.config.import=optional:file:.env[.properties]

server.port=8080

# Zona horaria del negocio: define qué día es "hoy" al validar fechas (MA-59)
marketplace.zona-horaria=America/Bogota

# ─── Base de datos ───────────────────────────────────────
# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Carga en lote las relaciones perezosas en los listados (evita una consulta por alojamiento)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true

# ─── Caché de versiones de sesión (ADR-010) ──────────────
spring.cache.cache-names=versionesSesion
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=60s

# ─── Actuator: health check que usa Traefik ──────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ─── Autenticación (MA-48, ADR-010) ──────────────────────
# Secreto HMAC del JWT: mínimo 32 caracteres, siempre por variable de entorno
marketplace.jwt.secreto=${JWT_SECRET}
marketplace.jwt.duracion=PT2H
# Tras 5 contraseñas incorrectas seguidas se bloquea el inicio de sesión 15 minutos
marketplace.seguridad.intentos-maximos=5
marketplace.seguridad.duracion-bloqueo=PT15M

# ─── Pagos (ADR-004, ADR-006) ────────────────────────────
# simulado (por defecto) o stripe. Con stripe se necesita STRIPE_SECRET_KEY (clave sk_test_...)
marketplace.pagos.proveedor=${PAGOS_PROVEEDOR:simulado}
marketplace.pagos.timeout=PT10S
marketplace.pagos.moneda=cop
marketplace.pagos.stripe.clave-secreta=${STRIPE_SECRET_KEY:}

# ─── Reservas (MA-60) ────────────────────────────────────
# Tiempo que se retienen las fechas mientras se paga
marketplace.reservas.retencion=PT10M
# Cada cuánto el conciliador revisa retenciones vencidas y pagos en duda
marketplace.reservas.conciliacion=PT30S
# Cada cuánto se completan las reservas confirmadas cuya fecha de salida ya llegó (MA-71)
marketplace.reservas.completar=PT1H

# ─── CORS: origen del frontend ───────────────────────────
marketplace.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:5173}

# ─── Swagger / OpenAPI ───────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true

# ─── Notificaciones (MA-75) ──────────────────────────────
# Cada cuánto se entregan los eventos del outbox y se envían los correos pendientes
marketplace.notificaciones.intervalo=PT10S
# Hilos para las tareas programadas: entregar eventos, enviar correos y conciliar reservas corren
# en paralelo, así un servidor de correo lento no retrasa a las demás
spring.task.scheduling.pool.size=4
# Copia por correo de cada notificación
marketplace.notificaciones.correo.activo=${CORREO_ACTIVO:true}
marketplace.notificaciones.correo.remitente=${MAIL_FROM:no-responder@inversioneslr.com}
# Un servidor de correo lento no deja el envío colgado (milisegundos)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
