# ─────────────────────────────────────────────────────────
# Configuración BASE, común a todos los ambientes.
# Lo que cambia por ambiente va en application-dev.properties
# y application-prod.properties.
# Ningún secreto va en estos archivos: llegan por variables de entorno.
# ─────────────────────────────────────────────────────────

spring.application.name=marketplace

# Perfil por defecto. En producción se cambia con SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# En desarrollo lee las variables del archivo backend/.env (no se sube al repositorio)
spring.config.import=optional:file:.env[.properties]

server.port=8080

# ─── Base de datos ───────────────────────────────────────
# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ─── Caché de versiones de sesión (ADR-010) ──────────────
spring.cache.cache-names=versionesSesion
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=60s

# ─── Actuator: health check que usa Traefik ──────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ─── CORS: origen del frontend ───────────────────────────
marketplace.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:5173}

# ─── Swagger / OpenAPI ───────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
