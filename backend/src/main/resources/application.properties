# ─────────────────────────────────────────────────────────
# Configuración BASE, común a todos los ambientes.
# Lo que cambia por ambiente va en application-dev.properties
# y application-prod.properties.
# Ningún secreto va en estos archivos: llegan por variables de entorno.
# ─────────────────────────────────────────────────────────

spring.application.name=marketplace

# Perfil por defecto. En producción se cambia con SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# En desarrollo lee las variables del archivo backend/.env (no se sube al repositorio)
spring.config.import=optional:file:.env[.properties]

server.port=8080

# ─── Base de datos ───────────────────────────────────────
# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Carga en lote las relaciones perezosas en los listados (evita una consulta por alojamiento)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true

# ─── Caché de versiones de sesión (ADR-010) ──────────────
spring.cache.cache-names=versionesSesion
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=60s

# ─── Actuator: health check que usa Traefik ──────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ─── Autenticación (MA-48, ADR-010) ──────────────────────
# Secreto HMAC del JWT: mínimo 32 caracteres, siempre por variable de entorno
marketplace.jwt.secreto=${JWT_SECRET}
marketplace.jwt.duracion=PT2H
# Tras 5 contraseñas incorrectas seguidas se bloquea el inicio de sesión 15 minutos
marketplace.seguridad.intentos-maximos=5
marketplace.seguridad.duracion-bloqueo=PT15M

# ─── CORS: origen del frontend ───────────────────────────
marketplace.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:5173}

# ─── Swagger / OpenAPI ───────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
