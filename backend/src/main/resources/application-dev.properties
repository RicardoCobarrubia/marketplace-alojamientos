# ─────────────────────────────────────────────────────────
# DESARROLLO (perfil por defecto)
# Los valores salen de backend/.env. Copia .env.example como .env.
# PostgreSQL y el buzón de correo de prueba se levantan con compose.yaml.
# ─────────────────────────────────────────────────────────

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
spring.datasource.username=${DB_USERNAME:marketplace}
spring.datasource.password=${DB_PASSWORD:}

# Correo: Mailpit (bandeja web en http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# Administrador para probar (opcional): se crea al arrancar si ambos tienen valor
marketplace.dev.admin.email=${ADMIN_EMAIL:}
marketplace.dev.admin.password=${ADMIN_PASSWORD:}

# Logs legibles en consola, con el id de correlación entre corchetes
logging.pattern.correlation=[%X{correlationId:-}] 
logging.level.co.edu.unbosque.marketplace=DEBUG
