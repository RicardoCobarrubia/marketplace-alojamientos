# Métricas del despliegue (MA-93, ADR-008). Prometheus las lee cada 15 s.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Cada réplica del backend por separado: el nombre "backend" de Docker devuelve la IP de todas
  - job_name: backend
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [backend]
        type: A
        port: 8080
        refresh_interval: 15s

  # El balanceador: peticiones que recibe, códigos de respuesta y estado de cada réplica
  - job_name: traefik
    static_configs:
      - targets: [traefik:8082]
